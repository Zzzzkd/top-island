appId: com.topisland.app
productName: Top Island
directories:
  output: release
asarUnpack:
  - node_modules/loudness/impl/windows/*.exe
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/scripts
    to: scripts
  - from: resources/tray-icon.png
    to: tray-icon.png
win:
  target:
    - nsis
  artifactName: ${name}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
